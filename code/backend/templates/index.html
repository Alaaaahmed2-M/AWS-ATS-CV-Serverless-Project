<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ATS CV Generator</title>
<style>
  body { font-family: Arial, sans-serif; max-width: 700px; margin: 40px auto; padding: 0 20px; }
  h1 { color: #2c3e50; }
  label { display: block; margin-top: 12px; font-weight: bold; }
  input, textarea { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; }
  textarea { height: 80px; }
  button { margin-top: 16px; padding: 10px 20px; background: #2c3e50; color: white; border: none; cursor: pointer; }
  #result, #analyzeResult { margin-top: 20px; padding: 12px; background: #f4f4f4; white-space: pre-wrap; }
  hr { margin: 40px 0; }
</style>
</head>
<body>

<h1>ATS CV Generator</h1>
<form id="cvForm">
  <label>Full Name</label>
  <input type="text" id="full_name" required>

  <label>Email</label>
  <input type="email" id="email" required>

  <label>Phone</label>
  <input type="text" id="phone" required>

  <label>Professional Summary</label>
  <textarea id="summary" required></textarea>

  <label>Skills</label>
  <textarea id="skills" required></textarea>

  <label>Experience</label>
  <textarea id="experience" required></textarea>

  <label>Education</label>
  <textarea id="education" required></textarea>

  <button type="submit">Generate CV</button>
</form>
<div id="result"></div>

<hr>

<h1>Analyze Job Description</h1>
<label>Job Description</label>
<textarea id="job_description" style="width:100%;height:120px;"></textarea>
<button id="analyzeBtn">Analyze</button>
<div id="analyzeResult"></div>

<script>
let lastCvId = null;

document.getElementById("cvForm").addEventListener("submit", async function(e) {
  e.preventDefault();
  const data = {
    full_name: document.getElementById("full_name").value,
    email: document.getElementById("email").value,
    phone: document.getElementById("phone").value,
    summary: document.getElementById("summary").value,
    skills: document.getElementById("skills").value,
    experience: document.getElementById("experience").value,
    education: document.getElementById("education").value
  };
  const res = await fetch("/generate-cv", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(data)
  });
  const json = await res.json();
  document.getElementById("result").innerText = JSON.stringify(json, null, 2);
  if (json.cv_id) lastCvId = json.cv_id;
});

document.getElementById("analyzeBtn").addEventListener("click", async function() {
  if (!lastCvId) {
    document.getElementById("analyzeResult").innerText = "Please generate a CV first.";
    return;
  }
  const data = {
    cv_id: lastCvId,
    job_description: document.getElementById("job_description").value
  };
  const res = await fetch("/analyze-cv", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(data)
  });
  const json = await res.json();
  document.getElementById("analyzeResult").innerText = JSON.stringify(json, null, 2);
});
</script>

</body>
</html>
